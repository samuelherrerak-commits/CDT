services:
  - type: web
    name: contabilidad-tiempo
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://script.google.com/macros/s/AKfycbxIvmuarFpP8IAjxRzP6AvR_keKmY92WLH62CY-wE41EV9Tn39ZIRY4CNc2JnmhzvzC5A/exec
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
